version: 2
updates:
  # Biblioteca (raiz): minor/patch agrupados (PRs pequenos e verdes);
  # majors ficam FORA dos grupos e vêm como PRs individuais (revisão/teste isolado).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      producao:
        dependency-type: production
        update-types:
          - minor
          - patch
      desenvolvimento:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Playground (app de teste local, não publicado): minor/patch agrupados.
  - package-ecosystem: npm
    directory: "/playground"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playground:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Actions dos workflows de CI/deploy.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
