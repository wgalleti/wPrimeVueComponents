version: 2
# PRs de version-update DESATIVADOS (open-pull-requests-limit: 0) — biblioteca de
# uso interno/solo, sem necessidade de bumps de rotina. Atualizações de SEGURANÇA
# continuam funcionando (não são limitadas por isto). Para retomar bumps de rotina,
# suba o limite (ex.: 5) e reintroduza os `groups`.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/playground"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
